# Supabase pauses free projects after ~7 days without activity. The POS syncs daily anyway;
# this is insurance for holidays. Needs repo secrets SUPABASE_URL and SUPABASE_ANON_KEY.
name: keep-supabase-alive
on:
  schedule:
    - cron: "0 3 */3 * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the project so the free tier never pauses
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "SUPABASE_URL secret not set; skipping"; exit 0; fi
          curl -sf "$SUPABASE_URL/rest/v1/orgs?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" -H "Authorization: Bearer $SUPABASE_ANON_KEY" > /dev/null
          echo "pinged"
